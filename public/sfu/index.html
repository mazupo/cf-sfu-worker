<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cf-sfu-worker viewer</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header>
      <h1>cf-sfu-worker viewer</h1>
      <nav>
        <a href="./" aria-current="page">Viewer</a>
        <a href="./device">Device simulator</a>
        <a href="./admin/">Dashboard</a>
      </nav>
    </header>

    <form class="panel" id="join-form">
      <label>API URL
        <input name="apiUrl" id="api-url" required>
      </label>
      <label>Viewer public key
        <input name="viewerKey" id="viewer-key" required autocomplete="off">
      </label>
      <label>Room
        <input name="room" id="room" required pattern="[A-Za-z0-9][A-Za-z0-9._\-]{0,63}" value="lab-a">
      </label>
      <label title="Leave it empty for a random ID. Kept for this tab only, so two tabs do not share one ID.">Viewer ID
        <input id="viewer-id" maxlength="64" placeholder="random" autocomplete="off">
      </label>
      <label class="check" title="Open the devices' data channels and take control of a device. Choose before you join.">
        <input type="checkbox" name="ipc" id="ipc"> Enable IPC
      </label>
      <div>
        <button type="submit" id="join">Join</button>
        <button type="button" class="secondary" id="leave" disabled>Leave</button>
      </div>
    </form>

    <p class="status" id="status">Not connected.</p>
    <section class="grid" id="tiles" aria-live="polite">
      <p class="empty">Join a room to see its devices. Devices start publishing when you join.</p>
    </section>

    <details class="panel debug" id="debug-panel">
      <summary>Server state <span class="status" id="debug-updated"></span></summary>
      <div id="debug-body"></div>
    </details>

    <details class="panel">
      <summary>Log</summary>
      <pre class="log" id="log"></pre>
    </details>
  </main>
  <script type="module" src="./js/viewer.js"></script>
</body>
</html>
