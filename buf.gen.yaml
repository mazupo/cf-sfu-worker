# npm run proto: generates src/proto from the protocol submodule. No protoc needed.
version: v2
inputs:
  - directory: external/protocol/protos
    paths:
      - external/protocol/protos/cloudflare.proto
      - external/protocol/protos/packet.proto
plugins:
  - local: protoc-gen-ts_proto
    out: src/proto
    opt:
      - esModuleInterop=true
      - outputJsonMethods=false
      - env=browser
